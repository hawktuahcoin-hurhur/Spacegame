<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacegame</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #cfe8ff; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; left: 16px; bottom: 16px; pointer-events: none; font-size: 13px; line-height: 1.5; text-shadow: 0 0 4px #000; }
      #help { position: fixed; right: 16px; top: 16px; pointer-events: none; font-size: 12px; opacity: 0.7; text-align: right; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="help">W/S throttle · A/D strafe · Q/E roll · Space/Ctrl up/down<br />Click to capture mouse · mouse to steer · Shift boost</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
